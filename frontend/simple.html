<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        console.log('Simple test starting...');
        const { createElement } = React;
        const { createRoot } = ReactDOM;
        
        function TestApp() {
            return createElement('div', {
                style: {
                    padding: '20px',
                    color: 'red',
                    fontSize: '24px',
                    background: 'white',
                    minHeight: '100vh'
                }
            }, '🚀 REACT IS WORKING! If you see this, the white page is fixed!');
        }
        
        try {
            const rootElement = document.getElementById('root');
            if (!rootElement) {
                throw new Error('Root element not found');
            }
            
            const root = createRoot(rootElement);
            root.render(createElement(TestApp));
            console.log('React app rendered successfully');
        } catch (error) {
            console.error('React app failed:', error);
            document.body.innerHTML = '<div style="padding:20px;color:red;font-size:24px;">React failed: ' + error + '</div>';
        }
    </script>
</body>
</html>
