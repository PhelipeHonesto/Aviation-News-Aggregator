<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
</head>
<body>
    <div id="root"></div>
    <script>
        console.log('Test page loaded');
        const root = document.getElementById('root');
        if (root) {
            root.innerHTML = '<div style="padding:20px;color:green;font-size:24px;background:white;min-height:100vh;">✅ Basic HTML/JS is working!</div>';
        } else {
            document.body.innerHTML = '<div style="padding:20px;color:red;font-size:24px;">ERROR: Root not found</div>';
        }
    </script>
</body>
</html>
