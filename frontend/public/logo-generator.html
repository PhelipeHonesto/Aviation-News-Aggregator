<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 20px; background: white; }
        .logo {
            font-family: 'Arial Black', Arial, sans-serif;
            font-weight: bold;
            font-size: 24px;
            color: #f17500;
            line-height: 1;
        }
        .logo-loud { display: block; }
        .logo-hawk { display: block; }
        .logo-k {
            position: relative;
            display: inline-block;
        }
        .logo-k::after {
            content: '→';
            position: absolute;
            right: -20px;
            top: 0;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <span class="logo-loud">LOUD</span>
        <span class="logo-hawk">HAW<span class="logo-k">K</span></span>
    </div>
</body>
</html>
