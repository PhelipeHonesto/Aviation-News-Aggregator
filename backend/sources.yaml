# ========== HTML FALLBACK EXAMPLES (no public RSS) ==========
- name: Example Airline Pressroom (HTML)
  category: AIRLINE
  weight: 5
  kind: html
  home: https://www.exampleair.com/newsroom
  selectors:
    item: "article, .post, .press-item"
    title: "h1 a, h2 a, .title a::text"
    link: "h1 a, h2 a, .title a::attr(href)"
    date: "time[datetime]::attr(datetime), .date::text"
    summary: ".excerpt, .summary, p::text"
